# Edezee CI: the same local gates AGENTS.md describes, run on every PR.
#
# The generated boilerplate this replaced installed only `flake8` and `pytest`,
# then ran a bare `pytest`. There is no requirements.txt at the repo root, so the
# backend dependencies were never installed; the harness suite imports `httpx`
# and failed with `ModuleNotFoundError` at collection, turning a green suite into
# 5 errors. Dependencies now come from the hashed lock file, and each suite runs
# where its own pytest.ini applies.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # --only-binary :all: refuses source distributions, so no dependency can
        # run a setup.py at install time; --require-hashes pins every version to
        # the hash in the lock file. This mirrors backend/Dockerfile.
        pip install --only-binary :all: flake8==7.1.2
        pip install --only-binary :all: --require-hashes -r backend/requirements.lock
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names.
        flake8 backend/app backend/tests evaluation --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Test backend
      run: cd backend && python -m pytest
    - name: Test evaluation harness
      run: python -m pytest evaluation/harness_tests -q
    - name: Evaluation gate (mock, 12/12)
      run: python evaluation/run_eval.py --mode mock --out evaluation/results/eval_results.json
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      # --ignore-scripts stops lifecycle scripts (pre/postinstall) from running.
      run: npm ci --ignore-scripts --no-audit --no-fund
      working-directory: frontend
    - name: Typecheck and build frontend
      # `next build` runs TypeScript and also generates the gitignored
      # next-env.d.ts that `tsc --noEmit` needs, so it goes first. `tsc` is
      # invoked through the package script's local binary, not `npx`, so no
      # package is fetched on demand.
      run: |
        npm run build
        ./node_modules/.bin/tsc --noEmit
      working-directory: frontend
